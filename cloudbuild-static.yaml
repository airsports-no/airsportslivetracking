steps:
# Match the terminal workflow exactly
- name: "node:22"
  entrypoint: "bash"
  args: 
    - "-c"
    - |
      npm ci
      npm run build
      ls -lh dist/_astro/*.css
      npx firebase-tools deploy --project ${_FIREBASE_PROJECT_ID} --non-interactive
  dir: "airsports_static"

substitutions:
  _FIREBASE_PROJECT_ID: "airsports-613ce"

options:
  logging: CLOUD_LOGGING_ONLY
