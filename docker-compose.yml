# Pure local development environment

services:
  tracker_daphne:
    container_name: tracker_daphne
    image: ${REGISTRY_NAME:-europe-north1-docker.pkg.dev/airsports-613ce/airsports/}tracker_base:${IMAGE_TAG:-develop}
    # Runs the same gunicorn+uvicorn ASGI stack as production (config/asgi.sh)
    # instead of Django's runserver, so HTTP/websocket concurrency behavior
    # under a scale test matches a real tracker-app pod. This trades away
    # runserver's autoreload for `docker compose up` users - the devcontainer
    # workflow (.vscode/tasks.json's "Run server" task) is unaffected, since
    # it attaches to this container and runs its own runserver process rather
    # than using this command.
    command: [ "/wait-for-it.sh", "mysql:3306", "--",
               "bash", "-c", "python3 manage.py migrate && python3 manage.py initadmin && python3 manage.py createdefaultscores && exec /asgi.sh" ]
    environment:
      - MODE=dev
      - MEDIA_LOCATION
      - MBTILES_SERVER_URL=http://mbtiles:8000/
      - MBTILES_PUBLIC_URL=http://localhost:8001/
      - MBTILES_PUBLISH_ROOT=/maptiles/user_uploaded_maps
      - MBTILES_RELOAD_METHOD=local
      - MBTILES_RELOAD_LOCAL_URL=http://mbtiles:8000/services/
      - REMOVE_BG_KEY
      - GOOGLE_APPLICATION_CREDENTIALS=/secret/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=airsports-613ce
      - DISABLE_FIREBASE
      - MPLCONFIGDIR=/tmp

    # env_file:
    #   - .env.private
    build:
      context: .
      dockerfile: Dockerfile
      target: tracker_base
    volumes:
      - ./secret:/secret
      - ./static:/static
      - ./assets:/assets
      - ./assets_vite:/assets_vite
      - ./src:/src
      - ./airsports_static:/airsports_static
      - ./data:/data
      - ./weblog:/logs
    ports:
      - "8002:8002"  # asgi.sh binds :8002, matching helm's tracker-app container port
    depends_on:
      - mysql
      - redis
      - traccar


  tracker_celery:
    container_name: tracker_celery
    image: ${REGISTRY_NAME:-europe-north1-docker.pkg.dev/airsports-613ce/airsports/}tracker_base:${IMAGE_TAG:-develop}
    # --without-mingle matches helm/templates/deployment_tracker_celery.yaml's
    # command exactly. This worker only ever consumes the default queue (no
    # -Q flag) - live-tracking calculator work goes to the live_calculator
    # service below, same split as production.
    command: [ "bash", "-c", "celery -A live_tracking_map worker -l DEBUG --concurrency 1 --without-mingle" ]
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/secret/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=airsports-613ce
      - MEDIA_LOCATION
      - MODE=dev
      # Opts add_positions_to_calculator (called from this worker's
      # process_flymaster_file task) into the same Celery-dispatch path
      # production uses, instead of MODE=dev's default of forking a local
      # process - see CALCULATOR_DISPATCH_VIA_CELERY in settings.py.
      - CALCULATOR_DISPATCH_VIA_CELERY=1
      - MBTILES_SERVER_URL=http://mbtiles:8000/
      - MBTILES_PUBLIC_URL=http://localhost:8001/
      - MBTILES_PUBLISH_ROOT=/maptiles/user_uploaded_maps
      - MBTILES_RELOAD_METHOD=local
      - MBTILES_RELOAD_LOCAL_URL=http://mbtiles:8000/services/
      - DISABLE_FIREBASE
      - MPLCONFIGDIR=/tmp
    volumes:
      - ./secret:/secret
      - ./django-rest-authemail:/django-rest-authemail
      - ./static:/static
      - ./assets:/assets
      - ./src:/src
      - ./airsports_static:/airsports_static
      - ./data:/data
      - ./celerylog:/logs
    depends_on:
      - mysql
      - redis
      - mbtiles
    # Same liveness signal as helm/templates/deployment_tracker_celery.yaml's
    # livenessProbe: celery_liveness.py checks a heartbeat file a Celery
    # bootstep touches every 10s, so this is environment-agnostic - just not
    # wired into docker-compose until now.
    healthcheck:
      test: [ "CMD", "python", "/src/celery_liveness.py" ]
      interval: 12s
      timeout: 10s
      retries: 2
      start_period: 30s


  live_calculator:
    container_name: live_calculator
    image: ${REGISTRY_NAME:-europe-north1-docker.pkg.dev/airsports-613ce/airsports/}tracker_base:${IMAGE_TAG:-develop}
    # Mirrors helm/templates/deployment_live_calculator.yaml's command. This is
    # production's second, dedicated Celery pool for per-contestant live
    # scoring - it has no local equivalent until this service. Concurrency
    # defaults to matching production's .Values.liveCalculator.concurrency
    # (helm/values.yaml); override with LIVE_CALCULATOR_CONCURRENCY for a
    # smaller/larger scale test run.
    command: [ "bash", "-c", "celery -A live_tracking_map worker -Q live_calculator -l INFO --concurrency=${LIVE_CALCULATOR_CONCURRENCY:-12} --without-mingle --without-gossip --without-heartbeat" ]
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/secret/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=airsports-613ce
      - MEDIA_LOCATION
      - MODE=dev
      - MBTILES_SERVER_URL=http://mbtiles:8000/
      - MBTILES_PUBLIC_URL=http://localhost:8001/
      - MBTILES_PUBLISH_ROOT=/maptiles/user_uploaded_maps
      - MBTILES_RELOAD_METHOD=local
      - MBTILES_RELOAD_LOCAL_URL=http://mbtiles:8000/services/
      - DISABLE_FIREBASE
      - MPLCONFIGDIR=/tmp
    volumes:
      - ./secret:/secret
      - ./django-rest-authemail:/django-rest-authemail
      - ./static:/static
      - ./assets:/assets
      - ./src:/src
      - ./airsports_static:/airsports_static
      - ./data:/data
      - ./celerylog:/logs
    depends_on:
      - mysql
      - redis
      - mbtiles
    healthcheck:
      test: [ "CMD", "python", "/src/celery_liveness.py" ]
      interval: 12s
      timeout: 10s
      retries: 2
      start_period: 30s


  tracker_processor:
    container_name: tracker_processor
    image: ${REGISTRY_NAME:-europe-north1-docker.pkg.dev/airsports-613ce/airsports/}tracker_base:${IMAGE_TAG:-develop}
    command: [ "bash", "-c", "python3 position_processor.py" ]
    restart: unless-stopped
    environment:
      - MODE=dev
      - MPLCONFIGDIR=/tmp
      # This is the producer side of the calculator dispatch decision - see
      # the same var on tracker_celery above.
      - CALCULATOR_DISPATCH_VIA_CELERY=1
    volumes:
      - ./secret:/secret
      - ./django-rest-authemail:/django-rest-authemail
      - ./src:/src
      - ./processorlog:/logs
    depends_on:
      - traccar
      - mysql
      - redis

  mbtiles:
    container_name: mbtiles
    image: ghcr.io/consbio/mbtileserver:latest
    command: ["/mbtileserver", "--enable-reload-signal", "--dir", "/tilesets-static,/tilesets-user"]
    volumes:
      - "/mnt/d/Airsports maps/local_dev:/tilesets-static:ro"
      - ./data/media/user_uploaded_maps:/tilesets-user
    ports:
      - "8001:8000"

  traccar:
    # Pinned to match helm/templates/deployment_traccar.yml's version exactly
    # (was an unpinned :ubuntu tag, which could silently drift ahead of prod).
    image: traccar/traccar:6.15-alpine
    restart: unless-stopped
    container_name: traccar
    volumes:
      - traccar-db:/opt/traccar/data/database
      - ./traccar_local_config/configuration/traccar.xml:/opt/traccar/conf/traccar.xml
    ports:
      - 5000-5150:5000-5150
      - 5000-5150:5000-5150/udp
      - 8082:8082
    depends_on:
      - mysql

  mysql:
    image: mysql
    container_name: mysql
    restart: always
    command: --max_allowed_packet=325058560 --max_connections=500
    # command: 
    #    - --innodb_flush_log_at_trx_commit=2
    #    - --innodb_doublewrite=0
    #    - --sync_binlog=0
    #    - --max_allowed_packet=1G
    #    - --innodb_buffer_pool_size=8G  # Set to ~50% of your available RAM

    environment:
      - MYSQL_ROOT_PASSWORD=traccar
    ports:
      - "3306:3306"
    volumes:
      - mysqldata3:/var/lib/mysql/
      - ./traccar_local_config/configuration/mysql.sql:/docker-entrypoint-initdb.d/mysql.sql
      - ./src:/src

  redis:
    image: redis
    #    build:
    #      context: .
    #      dockerfile: Dockerfile.redis
    container_name: redis

volumes:
  mysqldata3:
  traccar-db:
