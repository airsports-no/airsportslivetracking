apiVersion: batch/v1
kind: Job
metadata:
  name: calculator-job
spec:
  ttlSecondsAfterFinished: 259200  # Three days
  template:
    metadata:
      labels: {}
    spec:
      backoffLimit: 4
      containers:
      - image: europe-north1-docker.pkg.dev/airsports-613ce/airsports/tracker_base
        # 30-day Cloud Monitoring data across 91 calculator-job runs: CPU
        # median 4m, p90 29m, p99 139m, single observed peak 616m. Memory
        # median 202Mi, p90 262Mi, max 400Mi. The previous 400m/500Mi request
        # was carried forward unverified - CPU was ~3x above p99. Limits added
        # so a rare spike can burst (this cluster supports it) without being
        # unbounded.
        resources:
          requests:
            cpu: 150m
            memory: 400Mi
          limits:
            cpu: 750m
            memory: 512Mi
        name: calculator-job
        envFrom:
          - configMapRef:
              name: envs-production-other
          - secretRef:
              name: pw-secrets
        volumeMounts:
          - mountPath: /secret
            readOnly: true
            name: firebase
      restartPolicy: Never  # OnFailure
      volumes:
        - name: firebase
          secret:
            secretName: firebase-secrets
