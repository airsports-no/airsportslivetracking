{% extends "base_tailwind.html" %}
{% load static %}
{% load i18n %}
{% load crispy_forms_tags %}
{% load lucide %}


{% block content %}
<div class="container mx-auto p-4 md:p-8">
    <div class="card bg-base-100 shadow-xl max-w-3xl mx-auto">
        <div class="card-body">
            <h2 class="card-title">Generate map</h2>
            {% crispy form %}
        </div>
    </div>
</div>
<script src="{% static 'js/iro.min.js' %}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const colorInput = document.getElementById('id_colour');
        if (!colorInput) return;
        
        var colorPicker = new iro.ColorPicker('#picker', {
            color: colorInput.value
        });
        colorPicker.on('color:change', function (color) {
            colorInput.value = color.hexString;
        });

        const mapSource = document.getElementById("id_map_source");
        const zoomSelect = document.getElementById("id_zoom_level");
        const zoomLevels = JSON.parse('{{ system_map_zoom_levels | safe }}');

        function setOptions(mapName) {
            if(!zoomSelect || !zoomLevels || !mapName) return;
            while (zoomSelect.options.length > 0) {
                zoomSelect.remove(0);
            }
            const zoomOptions = zoomLevels[mapName] ?? [1, 15, 12];
            for (let i = zoomOptions[0]; i <= zoomOptions[1]; i++) {
                zoomSelect.add(new Option(i, i, false, i === zoomOptions[2]));
            }
        }
        
        if(mapSource) mapSource.onchange = () => { if(mapSource) setOptions(mapSource.value) };
        
        if (mapSource) setOptions(mapSource.value);
    });
</script>
{% endblock %}
