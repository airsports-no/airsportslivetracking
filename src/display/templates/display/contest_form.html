{% extends "base_tailwind.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<style>
    #map_location {
        width: 100% !important; /* Adjust width as needed */
        height: 300px; /* Adjust height as needed */
    }
</style>
<div class="container mx-auto p-4 md:p-8">
    <div class="card bg-base-100 shadow-xl max-w-3xl mx-auto">
        <div class="card-body">
            <h2 class="card-title">
                {% if object %}
                    Update Contest {{ object }}
                {% else %}
                    Create new Contest
                {% endif %}
            </h2>
            <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
            {{ form.media }}
            {% crispy form %}
        </div>
    </div>
</div>

<script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function () {
        const location = document.getElementById('id_location');
        if (location) {
            location.readOnly = true;
        }
        
        const timezoneField = document.getElementById('id_time_zone');
        if (timezoneField && !timezoneField.value) {
            try {
                const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
                if (tz) {
                    timezoneField.value = tz;
                }
            } catch (e) {
                console.error("Could not determine browser timezone", e);
            }
        }

        // Ensure datetime fields strip seconds if present in initial values
        ['id_start_time', 'id_finish_time'].forEach(id => {
            const el = document.getElementById(id);
            if (el && el.value && el.value.length > 16) {
                el.value = el.value.substring(0, 16);
            }
        });
    });
</script>
{% endblock %}
