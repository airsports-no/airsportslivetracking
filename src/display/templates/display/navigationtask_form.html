{% extends "base_tailwind.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mx-auto p-4 md:p-8">
    <div class="card bg-base-100 shadow-xl max-w-3xl mx-auto">
        <div class="card-body">
            <h2 class="card-title">Update Navigation Task {{ object }}</h2>
            {{ form.media }}
            {{ form.errors }}
            {% crispy form %}
        </div>
    </div>
</div>

<script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function () {
        // Ensure datetime fields strip seconds if present in initial values
        ['id_start_time', 'id_finish_time'].forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                if (el.value && el.value.length > 16) {
                    el.value = el.value.substring(0, 16);
                }
            }
        });
    });
</script>
{% endblock %}
