{% extends "base_tailwind.html" %}
{% load i18n %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mx-auto p-4 md:p-8">
    <div class="card bg-base-100 shadow-xl max-w-lg mx-auto">
        <div class="card-body">
            <h2 class="card-title">Change scorecard parameters for {{ navigation_task.name }} gate type {{ gate_score.get_gate_type_display }}</h2>
            {{ form.errors }}
            <form method="post" class="form mt-4">
                {% csrf_token %}
                {{ form.media }}
                {% crispy form %}
            </form>
        </div>
    </div>
</div>
{% endblock %}
