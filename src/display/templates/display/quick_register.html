{% extends "base_tailwind.html" %}
{% block content %}
<div class="container mx-auto p-4 md:p-8 max-w-md">
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
            {% if contest.logo %}
            <div class="flex justify-center mb-4">
                <img src="{{ contest.logo.url }}" alt="{{ contest.name }} logo" class="max-h-24 object-contain">
            </div>
            {% endif %}
            <h2 class="card-title text-2xl mb-1">{{ contest.name }}</h2>
            <h3 class="text-lg font-semibold mb-4 text-primary">{{ navigation_task.name }}</h3>
            <p class="mb-6">Enter your aircraft tail number to join the Poker Run.</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="form-control w-full">
                    <label class="label">
                        <span class="label-text font-bold">Tail Number</span>
                    </label>
                    <input type="text" name="tail_number" placeholder="e.g. LN-TAS" 
                           class="input input-bordered w-full text-lg uppercase" 
                           required autofocus pattern="[A-Za-z0-9\-]+" 
                           title="Alphanumeric characters and hyphens only">
                </div>
                
                <div class="card-actions justify-end mt-8">
                    <button type="submit" class="btn btn-primary w-full text-lg">Register & Start</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
