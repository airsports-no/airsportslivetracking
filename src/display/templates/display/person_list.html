{% extends "base_tailwind.html" %}
{% block content %}
<div class="container mx-auto p-4 md:p-8">
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
            <h1 class="card-title text-2xl font-bold">People</h1>
            <div class="overflow-x-auto mt-4">
                <table class="table table-sm w-full">
                    <thead>
                    <tr>
                        <th>Last name</th>
                        <th>First name</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    {% for object in object_list %}
                        <tr>
                            <td>{{ object.last_name }}</td>
                            <td>{{ object.first_name }}</td>
                            <td>
                                <a href="{% url 'person_update' object.pk %}" class="btn btn-sm btn-primary">Edit</a>
                            </td>
                        </tr>
                    {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
