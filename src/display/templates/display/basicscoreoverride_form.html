{% extends "base_tailwind.html" %}
{% load static %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container mx-auto p-4 md:p-8">
    <div class="card bg-base-100 shadow-xl max-w-lg mx-auto">
        <div class="card-body">
            <h2 class="card-title">Update score overriding for Navigation Task {{ object }}</h2>
            {{ form.media }}
            <form method="post" class="form">
                {% csrf_token %}
                {% crispy form %}
            </form>
        </div>
    </div>
</div>
{% endblock %}
