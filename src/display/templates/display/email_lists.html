{% extends "base_tailwind.html" %}
{% load guardian_tags %}
{% load tz %}

{% block content %}
<div class="container mx-auto p-4 md:p-8">
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
            <h2 class="card-title">Management</h2>
            <div class="card-actions">
                <a href="{% url 'user_delete' %}" class="btn btn-error">Delete a user</a>
            </div>

            <div class="mt-6">
                <h3 class="text-xl font-semibold">Users with contest creation privileges</h3>
                <div class="p-4 bg-base-200 rounded-box mt-2 prose max-w-none">
                    <p>{{ users_with_creation_privileges|join:", " }}</p>
                </div>
            </div>

            <div class="mt-6">
                <h3 class="text-xl font-semibold">All users</h3>
                <div class="p-4 bg-base-200 rounded-box mt-2 prose max-w-none">
                    <p>{{ all_users|join:", " }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
