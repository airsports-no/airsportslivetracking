{% extends "base_tailwind.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mx-auto p-4 md:p-8">
    <div class="card bg-base-100 shadow-xl max-w-3xl mx-auto">
        <div class="card-body">
            <h2 class="card-title">Team</h2>
            <p class="text-sm text-base-content/70">This is the resulting team based on previous choices. Consider updating country and logo if necessary.</p>
            {{ form.media }}
            {% crispy form %}
        </div>
    </div>
</div>
{% endblock %}
