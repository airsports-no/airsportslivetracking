apiVersion: v1
kind: ConfigMap
metadata:
  name: envs-production-other
data:
  REDIS_HOST: {{ include "live_tracking.redisHost" . }}
  REDIS_PORT: {{ .Values.externalRedis.port | quote}}
  MYSQL_HOST: {{ include "live_tracking.mysqlHost" . }}
  MYSQL_PORT: "3306"
  MYSQL_USER: tracker
  MYSQL_DB_NAME: tracker

  TRACCAR_HOST: {{ include "live_tracking.traccarHost" . }}
  TRACCAR_PORT: "8082"
  TRACCAR_PROTOCOL: http

  AUTHEMAIL_EMAIL_HOST: {{ .Values.smtp.host }}
  AUTHEMAIL_EMAIL_PORT: {{ .Values.smtp.port | quote }}
  AUTHEMAIL_EMAIL_HOST_USER: {{ .Values.smtp.user }}
  AUTHEMAIL_DEFAULT_EMAIL_FROM: support@airsports.no
  AUTHEMAIL_DEFAULT_EMAIL_BCC: support@airsports.no
  FIREBASE_WEB_API_KEY: "AIzaSyD_LDULS2RvLvhTtnLyEzARtbs-WgtFOAo"

  LOG_HANDLER: stackdriver

  MEDIA_LOCATION: {{ .Values.mediaLocation }}

  K8S_API: {{ .Values.k8sApi }}

  TRACCAR_USERNAME: {{ .Values.traccarUsername }}
  OPEN_SKY_USERNAME: {{ .Values.openskyUsername }}

  SECRET_KEY: {{ .Values.secretKey }}

  BUILD_ID: {{ .Values.image.tag | quote }}
  MBTILES_SERVER_URL: {{ .Values.mbtiles.serverUrl }}
  MBTILES_PUBLIC_URL: {{ .Values.mbtiles.publicUrl }}
  MBTILES_PUBLISH_ROOT: {{ .Values.mbtiles.publishRoot }}
  MPLCONFIGDIR: "/tmp"

  # CIMA task types are in closed beta: hidden from the task-type picker and
  # blocked at save time for everyone except superusers and users holding a
  # UserEntitlementGrant (Django admin > Display > User entitlement grants).
  # Flip GATE_CIMA_TASK_VISIBILITY to "false", or add "cima" to
  # DEFAULT_FREE_TASK_TYPE_GROUPS, to make CIMA generally available.
  GATE_CIMA_TASK_VISIBILITY: "true"
  DEFAULT_FREE_TASK_TYPE_GROUPS: "legacy"

