{{- if .Values.mbtiles.runStaticMigration }}
apiVersion: batch/v1
kind: Job
metadata:
  name: mbtiles-static-migration-{{ now | unixEpoch }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  ttlSecondsAfterFinished: 100
  backoffLimit: 2
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        date: "{{ now | unixEpoch }}"
    spec:
      restartPolicy: Never
      serviceAccountName: calculator-scheduler
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # This Job's pod and the still-running mbtiles Deployment pod (see
      # deployment_mbtileserver.yml) both mount legacyPvcName (ReadWriteOnce) at the same
      # time - a pre-upgrade hook runs before Helm updates the Deployment, so the old pod is
      # still up. ReadWriteOnce allows concurrent mounters only on the same node, so without
      # this affinity the scheduler could place this pod on a different node than the mbtiles
      # pod, producing a FailedAttachVolume/Multi-Attach error.
      #
      # Soft (preferred), not hard (required): a required affinity blocks scheduling entirely
      # whenever no service=mbtiles pod happens to be up at that instant (a node drain, an
      # OOM-kill, anything transient) - stuck Pending until activeDeadlineSeconds, failing the
      # whole upgrade for an unrelated, momentary reason. Soft affinity still steers the
      # scheduler onto the same node in the normal case (mbtiles pod running - the only case
      # where the Multi-Attach risk above is even possible), while still letting this pod
      # schedule anywhere if no mbtiles pod exists to contend with the PVC at all.
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    service: mbtiles
                topologyKey: kubernetes.io/hostname
      containers:
        - name: mbtiles-static-migration
          # Deliberately NOT writing through a gcsfuse-mounted destination volume (the
          # previous approach): gcsfuse's CSI driver stages every write through the pod's
          # ephemeral-storage-backed sidecar cache before uploading, and GKE Autopilot's
          # standard compute class hard-caps total pod ephemeral storage at 10Gi - not
          # adjustable via the gke-gcsfuse/ephemeral-storage-* annotations (Autopilot
          # silently clamps any higher value). The legacy dataset's largest single file
          # (Norway250k.mbtiles, ~7.9Gi as of writing - verified via `kubectl exec ... du`
          # against the legacy PVC) leaves too little headroom under that ceiling to trust
          # a gcsfuse-mediated write; see
          # https://github.com/GoogleCloudPlatform/gcs-fuse-csi-driver/issues/21, an open,
          # unresolved upstream issue about files approaching this same limit.
          #
          # `gcloud storage rsync` instead streams straight to the GCS JSON API over
          # network, authenticated via this Job's existing Workload Identity binding
          # (calculator-scheduler) - no local staging of whole files, so it isn't subject
          # to the ephemeral-storage ceiling at all, and rsync (vs. cp) makes this Job
          # idempotent/safely retryable if backoffLimit above kicks in.
          image: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
          command:
            - "sh"
            - "-c"
            - >
              set -eu;
              echo "Syncing static mbtiles from the legacy volume to the static_maps GCS prefix...";
              gcloud storage rsync --recursive /source
              gs://{{ .Values.mbtiles.bucketName }}/{{ .Values.mbtiles.staticGcsPrefix }};
              echo "Done. Destination contents:";
              gcloud storage ls gs://{{ .Values.mbtiles.bucketName }}/{{ .Values.mbtiles.staticGcsPrefix }}/
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - name: mbtiles-static-legacy
              mountPath: /source
              readOnly: true
      volumes:
        - name: mbtiles-static-legacy
          persistentVolumeClaim:
            claimName: {{ .Values.mbtiles.legacyPvcName }}
            readOnly: true
{{- end }}
