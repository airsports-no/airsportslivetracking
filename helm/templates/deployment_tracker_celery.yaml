apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    service: tracker-celery
  name: tracker-celery
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      service: tracker-celery
  template:
    metadata:
      labels:
        service: tracker-celery
        date: "{{ now | unixEpoch }}"
    spec:
      terminationGracePeriodSeconds: 25
      securityContext:
        runAsNonRoot: true
        runAsUser: 200
        fsGroup: 200
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: cloud.google.com/gke-spot
                    operator: In
                    values:
                      - "true"
      # Required for permissions to create kubernetes jobs.
      serviceAccountName: calculator-scheduler
      containers:
      - image: europe-north1-docker.pkg.dev/airsports-613ce/airsports/tracker_base:{{ .Values.image.tag }}
        command: [ "bash", "-c", "celery -A live_tracking_map worker -l DEBUG --concurrency 1 --without-mingle" ]
        name: tracker-celery
        envFrom:
          - configMapRef:
              name: envs-production-other
          - secretRef:
              name: pw-secrets
        env:
          - name: MBTILES_RELOAD_METHOD
            value: "kubernetes"
          - name: MBTILES_RELOAD_ENABLED
            value: "1"
          - name: MBTILES_RELOAD_NAMESPACE
            value: "default"
          - name: MBTILES_RELOAD_POD_LABEL_SELECTOR
            value: "service=mbtiles"
        # CPU request lowered from 500m: tracker-celery-recommender (recommendation-only VPA)
        # shows actual usage around 25m over the last two idle weeks. Kept at 250m rather than
        # the VPA number - that's the Autopilot 1:6.5 vCPU:GiB requests ratio floor for 1536Mi
        # memory (~231m), so it's the real achievable minimum, not a guess. Limit raised to
        # 1000m (a full core) so a single periodic heavy task (track recalculation, flight
        # order generation) can burst instead of getting throttled at a quarter core - but no
        # higher, since this pod runs exactly one prefork worker (--concurrency 1) and a single
        # GIL-bound Python process can't use more than one core anyway. hpa-tracker-celery
        # (1-10 replicas) covers sustained/concurrent load; this limit is just about not
        # choking a single in-flight heavy task. Memory left untouched - a past OOM incident
        # sized it, and the VPA target (1332Mi) is close enough to current that touching it
        # isn't worth the risk.
        resources:
          requests:
            cpu: 250m
            memory: 1536Mi
          limits:
            cpu: 1000m
            memory: 3Gi
        volumeMounts:
          - mountPath: /secret
            readOnly: true
            name: firebase
        livenessProbe:
          exec:
            # bash is needed to replace the environment variable
            command: [
                "bash",
                "-c",
                "python /src/celery_liveness.py"
            ]
          initialDelaySeconds: 30  # startup takes some time
          periodSeconds: 12  # default is quite often and celery uses a lot cpu/ram then.
          timeoutSeconds: 10
          failureThreshold: 2
        readinessProbe:
          exec:
            # bash is needed to replace the environment variable
            command: [
              "bash",
              "-c",
              "python /src/celery_readiness.py"
            ]
          initialDelaySeconds: 30  # startup takes some time
          periodSeconds: 60  # reduced from 300 to speed up rollouts while respecting resource usage.
          timeoutSeconds: 10
          failureThreshold: 3
      restartPolicy: Always
      volumes:
        - name: firebase
          secret:
            secretName: firebase-secrets
