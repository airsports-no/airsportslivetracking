kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1beta1
metadata:
  name: traccarclient-external
spec:
  parentRefs:
  - kind: Gateway
    name: external-http-premium
  hostnames:
  - "traccarclient.airsports.no"
  rules:
  - filters:
    - type: ExtensionRef
      extensionRef:
        group: networking.gke.io
        kind: GCPHTTPFilter
        name: cdn-use-origin-headers
    backendRefs:
    - name: traccar-service-gateway
      port: 5055