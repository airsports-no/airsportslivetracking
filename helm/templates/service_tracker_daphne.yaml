apiVersion: v1
kind: Service
metadata:
  name: tracker-daphne-service
  annotations:
    cloud.google.com/backend-config: '{"default": "websocket-backend"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  ports:
  - port: 80
    targetPort: 8003
    protocol: TCP
  selector:
    service: tracker-daphne
  type: ClusterIP
