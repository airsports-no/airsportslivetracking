apiVersion: apps/v1
kind: Deployment
metadata:
  name: mbtiles

spec:
  # 2, not 1: GKE Autopilot's Node Auto-Provisioning periodically consolidates/scales down
  # underutilized nodes, deleting whatever pods are on them outright - that's a normal,
  # frequent event, not a failure, but with a single replica it left mbtiles.airsports.no
  # with zero healthy backends until the replacement pod passed its readiness probe
  # (observed live: the mbtiles-service NEG hit "EnterDegradedMode" - endpoint count went to
  # zero - during a routine scale-down consolidation). This Deployment was already designed
  # for >1 replica: the switch to gcsfuse (see the mbtiles-static volume comment below) was
  # specifically so any number of pods could read the same GCS prefix concurrently, with no
  # accessMode/concurrent-mounter restriction to work around.
  replicas: 2
  selector:
    matchLabels:
      service: mbtiles
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        service: mbtiles
      annotations:
        gke-gcsfuse/volumes: "true"
        # gcsfuse serves reads directly against GCS (byte-range GETs) without needing the
        # whole file locally, but mbtileserver's SQLite queries into the static .mbtiles
        # files are small random-offset reads - each one is otherwise a separate network
        # round trip. fileCacheForRangeRead (below) makes the first such read per file
        # trigger a background full-file download into a local cache, so it needs sidecar
        # ephemeral storage well above staticFileCacheSize to hold that cache plus temp
        # download state - the pre-GKE-1.29.1-gke.1670000 sidecar default is only 5Gi.
        gke-gcsfuse/ephemeral-storage-limit: {{ .Values.mbtiles.staticFileCacheSidecarStorageLimit | quote }}
        gke-gcsfuse/ephemeral-storage-request: {{ .Values.mbtiles.staticFileCacheSidecarStorageRequest | quote }}
    spec:
      terminationGracePeriodSeconds: 25
      serviceAccountName: calculator-scheduler
      # Soft (preferred, not required) anti-affinity: without this, nothing stops the
      # scheduler from placing both replicas on the same node, which would silently defeat
      # the point of replicas: 2 above - an actual node failure (as opposed to the voluntary
      # drain the PodDisruptionBudget guards against) would still take out every mbtiles pod
      # at once. Preferred rather than required for the same reason as the migration Job's
      # podAffinity (see job_mbtiles_static_migration.yaml): a required rule would leave the
      # second replica stuck Pending whenever the cluster genuinely has no second suitable
      # node free, instead of just falling back to co-location.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    service: mbtiles
                topologyKey: kubernetes.io/hostname
      volumes:
        # GCS (via gcsfuse) rather than a PersistentVolumeClaim: a PVC would need
        # ReadWriteMany to let a new pod mount the same static tiles before the old one
        # terminates (see the RollingUpdate strategy above), and the only RWX-capable
        # StorageClass available (filestore-maps, GCP Filestore) has a 1TiB standard-tier
        # minimum - ~$220/month for what is a ~30GB dataset. GCS buckets have no
        # accessMode/concurrent-mounter restriction at all, and this repo already relies on
        # gcsfuse serving .mbtiles files to this exact mbtileserver binary for the
        # user-uploaded-maps volume below, so this is a proven pattern, not a new one.
        - name: mbtiles-static
          csi:
            driver: gcsfuse.csi.storage.gke.io
            readOnly: true
            volumeAttributes:
              bucketName: {{ .Values.mbtiles.bucketName | quote }}
              mountOptions: {{ printf "%s,only-dir=%s" .Values.mbtiles.gcsfuse.mountOptions .Values.mbtiles.staticGcsPrefix | quote }}
              # SQLite's B-tree lookups into the .mbtiles files are scattered random-offset
              # reads - fileCacheForRangeRead makes the first such read on a file trigger an
              # async full-file download into the local cache (backed by node ephemeral
              # storage/Local SSD, see the ephemeral-storage annotations above), so every
              # later read of that file - from any pod - is served locally instead of over
              # the network. fileCacheCapacity bounds the cache so it can't fill node disk.
              fileCacheForRangeRead: "true"
              fileCacheCapacity: {{ .Values.mbtiles.staticFileCacheSize | quote }}
        - name: mbtiles-uploaded
          csi:
            driver: gcsfuse.csi.storage.gke.io
            readOnly: true
            volumeAttributes:
              bucketName: {{ .Values.mbtiles.bucketName | quote }}
              mountOptions: {{ printf "%s,only-dir=user_uploaded_maps" .Values.mbtiles.gcsfuse.mountOptions | quote }}
      containers:
        - name: mbtiles
          image: ghcr.io/consbio/mbtileserver:latest
          ports:
            - containerPort: 8000
              name: http
          command: ["/mbtileserver", "--enable-reload-signal", "--dir", "/tilesets-static,/tilesets-user"]
          resources:
            requests:
              cpu: 50m
              memory: 0.25Gi
          livenessProbe:
            httpGet:
              path: /services/
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 60
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /services/
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 60
            failureThreshold: 3
          volumeMounts:
            - mountPath: {{ .Values.mbtiles.staticMountPath | quote }}
              name: mbtiles-static
              readOnly: true
            - mountPath: "/tilesets-user"
              name: mbtiles-uploaded
---
# Backstop for the replica count above: without this, Cluster Autoscaler/NAP is still free
# to evict both mbtiles pods for the same node-consolidation event (nothing stops it from
# picking two nodes to drain in the same pass), recreating the zero-endpoint gap this was
# meant to close. minAvailable: 1 forces it to drain one node at a time for this workload.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mbtiles
spec:
  minAvailable: 1
  selector:
    matchLabels:
      service: mbtiles
---
apiVersion: v1
kind: Service
metadata:
  name: mbtiles-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    service: mbtiles
