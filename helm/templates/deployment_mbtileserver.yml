apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-mbtiles
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
  storageClassName: standard-rwo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mbtiles

spec:
  replicas: 1
  selector:
    matchLabels:
      service: mbtiles
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        service: mbtiles
    spec:
      terminationGracePeriodSeconds: 25
      serviceAccountName: calculator-scheduler
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: cloud.google.com/gke-spot
                    operator: In
                    values:
                      - "true"
      volumes:
        - name: mbtiles-static
          persistentVolumeClaim:
            claimName: pvc-mbtiles
        - name: mbtiles-uploaded
          csi:
            driver: gcsfuse.csi.storage.gke.io
            readOnly: true
            volumeAttributes:
              bucketName: {{ .Values.mbtiles.bucketName | quote }}
              mountOptions: {{ printf "%s,only-dir=user_uploaded_maps" .Values.mbtiles.gcsfuse.mountOptions | quote }}
      containers:
        - name: mbtiles
          image: ghcr.io/consbio/mbtileserver:latest
          ports:
            - containerPort: 8000
              name: http
          command: ["/mbtileserver", "--enable-reload-signal", "--dir", "/tilesets-static,/tilesets-user"]
          resources:
            requests:
              cpu: 50m
              memory: 0.25Gi
          livenessProbe:
            httpGet:
              path: /services/
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 60
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /services/
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 60
            failureThreshold: 3
          volumeMounts:
            - mountPath: {{ .Values.mbtiles.staticMountPath | quote }}
              name: mbtiles-static
            - mountPath: "/tilesets-user"
              name: mbtiles-uploaded
---
apiVersion: v1
kind: Service
metadata:
  name: mbtiles-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    service: mbtiles
