apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    service: tracker-web
  name: tracker-web
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      service: tracker-web
  template:
    metadata:
      labels:
        service: tracker-web
        date: "{{ now | unixEpoch }}"
    spec:
      terminationGracePeriodSeconds: 45
      containers:
      - image: europe-west3-docker.pkg.dev/airsports-613ce/airsports/tracker_base:{{ .Values.image.tag }}
        command: [ "bash", "-c", "/gunicorn.sh" ]
        name: tracker-web
        lifecycle:
          preStop:
            exec:
              command: ["/bin/bash", "-c", "sleep 20"]
        ports:
          - name: web
            containerPort: 8002
        env:
          - name: GUNICORN_TIMEOUT
            value: "60"
          - name: NUM_WORKERS
            value: "1"
          - name: NUM_THREADS
            value: "2"
        envFrom:
          - configMapRef:
              name: envs-production-other
          - secretRef:
              name: pw-secrets
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 250m
            memory: 512Mi

        volumeMounts:
          - mountPath: /secret
            readOnly: true
            name: firebase
        livenessProbe:
          httpGet:
            path: /display/healthz/
            port: web
          initialDelaySeconds: 5
          periodSeconds: 60
          timeoutSeconds: 30
          failureThreshold: 2
        readinessProbe:
          httpGet:
            path: /display/readyz/
            port: web
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 30
          failureThreshold: 3
      restartPolicy: Always
      volumes:
        - name: firebase
          secret:
            secretName: firebase-secrets

  