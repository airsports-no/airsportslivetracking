{{- if .Values.prewarmBuffer.enabled }}
# Standing over-provisioning headroom.
#
# On Autopilot the slow part of scaling up is node provisioning (~60-90s), not
# pod start. These pause pods do nothing but hold a node reservation at a
# negative priority, so the moment a real pod needs room the scheduler
# preempts them and schedules onto already-warm capacity instead of waiting
# for a new node.
#
# This is the always-on baseline (a couple of pods' worth). The bulk
# pre-contest prewarm remains the manual scripts/gke-prewarm/prewarm.sh.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: low-priority-pause
value: -10
globalDefault: false
description: "Low priority class for pause pods to over-provision capacity."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gke-prewarm-buffer
  labels:
    app: prewarm-buffer
spec:
  replicas: {{ .Values.prewarmBuffer.replicas }}
  selector:
    matchLabels:
      app: prewarm-buffer
  template:
    metadata:
      labels:
        app: prewarm-buffer
    spec:
      priorityClassName: low-priority-pause
      # Nothing is lost by killing these instantly - that is the entire point.
      terminationGracePeriodSeconds: 0
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            cpu: {{ .Values.prewarmBuffer.cpu }}
            memory: {{ .Values.prewarmBuffer.memory }}
{{- end }}
