# Websocket entry point. Selects the same merged pods as tracker-web-service;
# it exists separately so the 3600s timeout / connection-draining
# GCPBackendPolicy in httproute_root.yaml applies to /ws only, and not to
# ordinary HTTP traffic. Name kept unchanged so that policy and the
# HealthCheckPolicy stay attached.
apiVersion: v1
kind: Service
metadata:
  name: tracker-daphne-service-gateway
spec:
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
  selector:
    service: tracker-app
  type: ClusterIP
