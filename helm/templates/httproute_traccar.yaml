kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1beta1
metadata:
  name: traccar-external
spec:
  parentRefs:
  - kind: Gateway
    name: external-http-premium
  hostnames:
  - "traccar.airsports.no"
  rules:
  - filters:
    - type: ExtensionRef
      extensionRef:
        group: networking.gke.io
        kind: GCPHTTPFilter
        name: cdn-use-origin-headers
    backendRefs:
    - name: traccar-service-gateway
      port: 8082
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: traccar-health-check-policy
  namespace: default
spec:
  default:
    # See the comment on web-health-check-policy in httproute_root.yaml -
    # checkIntervalSec/timeoutSec belong here, not inside httpHealthCheck.
    checkIntervalSec: 10
    timeoutSec: 5
    logConfig:
      enabled: true
    config:
      type: HTTP
      httpHealthCheck:
        port: 8082
        requestPath: /api/server?force=true
  targetRef:
    group: ""
    kind: Service
    name: traccar-service-gateway
---
# traccar-service-gateway previously had no GCPBackendPolicy, so it kept GCP's 30s default
# backend timeout (see the comment on tracker-web-service's own lack of one, in
# service_tracker_web.yaml). Position-reporting apps hold their HTTP connection open across
# gaps between reports; once a gap exceeds the backend timeout, the load balancer tears down
# the idle connection to Traccar, and the client's next reused request on it gets reset before
# reaching the backend - Envoy reports this to the client as "503 upstream connect error /
# reset reason: connection termination". Reported from production: confirmed failing for iOS
# (whose URLSession reuses persistent connections across longer background-location gaps than
# Android's client tends to), never for Android. Mirrors daphne-backend-policy's 3600s fix in
# httproute_root.yaml for the same underlying "idle connection outlives the backend timeout"
# problem on /ws.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: traccar-backend-policy
  namespace: default
spec:
  default:
    timeoutSec: 300
    connectionDraining:
      drainingTimeoutSec: 60
  targetRef:
    group: ""
    kind: Service
    name: traccar-service-gateway