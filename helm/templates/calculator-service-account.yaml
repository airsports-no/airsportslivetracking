apiVersion: v1
kind: ServiceAccount
metadata:
  name: calculator-scheduler
  annotations:
    # Requires workload identity: https://cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
    # Last command was adding workload pool to cluster: gcloud container clusters update airsports-cluster \
    # --region=europe-north1 \
    # --workload-pool=airsports-613ce.svc.id.goog
    iam.gke.io/gcp-service-account: airsports@airsports-613ce.iam.gserviceaccount.com

---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: x20-jobs-sp-role
rules:
# pods / pods/exec: used by the mbtiles reload feature
# (src/display/flight_order_and_maps/user_uploaded_mbtiles_publish.py) to list
# and signal mbtiles pods from tracker-celery.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["get", "create"]
# deployments/scale: used by src/calculator_pool_scaler.py (tracker-processor) to
# scale the live-calculator Deployment. Replaces the old batch/jobs grant, which
# was for the per-contestant Kubernetes Jobs model this chart no longer uses.
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: x20-jobs-sp-rolebinding
subjects:
  - kind: ServiceAccount
    # Reference to ServiceAccount kind's `metadata.name`
    name: calculator-scheduler
    # Reference to ServiceAccount kind's `metadata.namespace`
    namespace: default
roleRef:
  kind: ClusterRole
  name: x20-jobs-sp-role
  apiGroup: rbac.authorization.k8s.io