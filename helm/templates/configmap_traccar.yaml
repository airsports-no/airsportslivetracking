apiVersion: v1
kind: ConfigMap
metadata:
  name: config-traccar
data:
  traccar.xml: |
    <?xml version='1.0' encoding='UTF-8'?>

    <!DOCTYPE properties SYSTEM 'http://java.sun.com/dtd/properties.dtd'>

    <properties>

        <entry key='config.default'>./conf/default.xml</entry>

        <!--

        This is the main configuration file. All your configuration parameters should be placed in this file.

        Default configuration parameters are located in the "default.xml" file. You should not modify it to avoid issues
        with upgrading to a new version. Parameters in the main config file override values in the default file. Do not
        remove "config.default" parameter from this file unless you know what you are doing.

        For list of available parameters see following page: https://www.traccar.org/configuration-file/

        -->
        <entry key='database.driver'>com.mysql.cj.jdbc.Driver</entry>
        <entry key='database.url'>jdbc:mysql://{{ include "live_tracking.mysqlHost" . }}:3306/{{ .Values.traccar.database }}?serverTimezone=UTC&amp;useSSL=false&amp;allowMultiQueries=true&amp;autoReconnect=true&amp;useUnicode=yes&amp;characterEncoding=UTF-8&amp;sessionVariables=sql_mode=''&amp;allowPublicKeyRetrieval=true</entry>
        <entry key='database.user'>{{ .Values.traccar.username }}</entry>
        <entry key='database.password'>{{ .Values.externalMysql.traccarPassword }}</entry>
        <entry key="web.origin">*</entry>
        <entry key='logger.enable'>true</entry>
        <!-- TEMPORARY diagnostic logging for the iOS position-upload 503/JsonParsingException
        investigation - logs raw protocol traffic (all 100+ ports, not just OsmAnd) as text so
        we can see the actual bytes iOS posts right before OsmAndProtocolDecoder's
        JsonParsingException. Revert both entries back to 'warning' / remove decodeTextData
        once enough failing samples are captured - this is noisy and logs raw device data. -->
        <entry key='logger.level'>all</entry>
        <entry key='logger.decodeTextData'>true</entry>
        <entry key='logger.file'>/dev/stdout</entry>
        <entry key='logger.rotate'>false</entry>
    </properties>
