apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    service: tracker-processor
  name: tracker-processor
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      service: tracker-processor
  template:
    metadata:
      labels:
        service: tracker-processor
        date: "{{ now | unixEpoch }}"
    spec:
      terminationGracePeriodSeconds: 25
      # Required for permissions to scale the live-calculator Deployment
      # (src/calculator_pool_scaler.py) - see helm/templates/calculator-service-account.yaml.
      serviceAccountName: calculator-scheduler
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: cloud.google.com/gke-spot
                    operator: In
                    values:
                      - "true"
      nodeSelector:
        iam.gke.io/gke-metadata-server-enabled: "true"
      containers:
      - image: europe-north1-docker.pkg.dev/airsports-613ce/airsports/tracker_base:{{ .Values.image.tag }}
        command: [ "bash", "-c", "python3 position_processor.py" ]
        # 600m/1Gi (req==limit) was never measured - the tracker-processor-recommender
        # VPA (kubectl describe vpa tracker-processor-recommender) reports Target
        # cpu 15m / memory 503Mi and Upper Bound cpu 15m / memory 512Mi from ~2
        # days observing real production traffic on this Deployment (a local
        # docker-compose scale test run the same week has no bearing on this -
        # it never touches the real cluster or this VPA). This process mostly
        # shuttles JSON/dicts between threads and does light cache/DB lookups,
        # so low CPU tracks. Request set well above that Target rather than at
        # it (only ~2 days of data, and a lost tracker-processor pod breaks
        # live ingestion for everyone), Burstable rather than Guaranteed QoS
        # since the old Guaranteed 600m ceiling bought nothing real usage ever
        # needed. Re-check this VPA after a real contest day and tighten
        # further if the numbers hold.
        resources:
          requests:
            cpu: 100m
            memory: 640Mi
          limits:
            cpu: 500m
            memory: 1Gi
        name: tracker-processor
        envFrom:
          - configMapRef:
              name: envs-production-other
          - secretRef:
              name: pw-secrets
        env:
          - name: CALCULATOR_POOL_SCALING_ENABLED
            value: "1"
          - name: CALCULATOR_POOL_DEPLOYMENT
            value: "live-calculator"
          - name: CALCULATOR_POOL_NAMESPACE
            value: "default"
          - name: CALCULATOR_POOL_SLOTS_PER_POD
            value: "{{ .Values.liveCalculator.slotsPerPod }}"
          - name: CALCULATOR_POOL_MAX_REPLICAS
            value: "{{ .Values.liveCalculator.maxReplicas }}"
          - name: CALCULATOR_POOL_PREWARM_MINUTES
            value: "{{ .Values.liveCalculator.prewarmMinutes }}"
          - name: CALCULATOR_POOL_POLL_SECONDS
            value: "{{ .Values.liveCalculator.pollSeconds }}"
        # Disable cloud logging, permission problem
        # env:
        #   - name: LOG_HANDLER
        #     value: ""
        livenessProbe:
          exec:
            # bash is needed to replace the environment variable
            command: [
              "bash",
              "-c",
              "python -m probes.is_alive || (for pid in $(ps axo pid --no-headers); do ps -p $pid -o command --no-headers ; ps -T -p $pid; done; false )"
            ]
          initialDelaySeconds: 30  # startup takes some time
          periodSeconds: 120
          timeoutSeconds: 10
        readinessProbe:
          exec:
            # bash is needed to replace the environment variable
            command: [
              "python", "-m", "probes.is_ready"
            ]
          initialDelaySeconds: 30  # startup takes some time
          periodSeconds: 30
          timeoutSeconds: 10
        volumeMounts:
          - mountPath: /secret
            readOnly: true
            name: firebase
      restartPolicy: Always
      volumes:
        - name: firebase
          secret:
            secretName: firebase-secrets
