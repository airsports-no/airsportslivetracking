kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1beta1
metadata:
  name: root-external
spec:
  parentRefs:
  - kind: Gateway
    name: external-http-premium
  hostnames:
  - "airsports.no"
  - "www.airsports.no"
  - "app.airsports.no"
  rules:
  - filters:
    - type: ExtensionRef
      extensionRef:
        group: networking.gke.io
        kind: GCPHTTPFilter
        name: cdn-use-origin-headers
    backendRefs:
    - name: tracker-daphne-service-gateway
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /ws
  - filters:
    - type: ExtensionRef
      extensionRef:
        group: networking.gke.io
        kind: GCPHTTPFilter
        name: cdn-use-origin-headers
    backendRefs:
    - name: tracker-web-service
      port: 80
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: web-health-check-policy
  namespace: default
spec:
  default:
    # checkIntervalSec/timeoutSec live directly under `default` (siblings of
    # `config`), not nested inside config.httpHealthCheck - the CRD used to
    # accept them there (or this chart never validated against the live
    # schema), but the current networking.gke.io/v1 HealthCheckPolicy schema
    # rejects them as unknown fields at that nesting, which fails a real
    # `kubectl apply`/`helm upgrade` for this resource (confirmed via
    # `kubectl explain healthcheckpolicy.spec.default` against the live
    # cluster).
    checkIntervalSec: 10
    timeoutSec: 5
    logConfig:
      enabled: true
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /display/healthz/
  targetRef:
    group: ""
    kind: Service
    name: tracker-web-service
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: daphne-health-check-policy
  namespace: default
spec:
  default:
    checkIntervalSec: 10
    timeoutSec: 5
    logConfig:
      enabled: true
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /display/healthz/
  targetRef:
    group: ""
    kind: Service
    name: tracker-daphne-service-gateway
---
# Replaces BackendConfig
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: daphne-backend-policy
  namespace: default
spec:
  default:
    timeoutSec: 3600
    connectionDraining:
      drainingTimeoutSec: 3600
  targetRef:
    group: ""
    kind: Service
    name: tracker-daphne-service-gateway
---
# The HTTP Service previously had no policy at all, which means GCP's default
# connection draining of 0s: in-flight requests are cut the instant an
# endpoint is deprogrammed during a rollout. Keep the timeout well below the
# /ws 3600s so a wedged request cannot pin a connection for an hour.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: web-backend-policy
  namespace: default
spec:
  default:
    timeoutSec: 60
    connectionDraining:
      drainingTimeoutSec: 60
  targetRef:
    group: ""
    kind: Service
    name: tracker-web-service