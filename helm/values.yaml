# Default values for live-tracking-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

namespace: testing

image:
  repository: nginx
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "develop"

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80


emailAddress: frankose@ifi.uio.no
openskyUsername: username
openskyPassword: password

storageAccountName: airsportsstorage2
mediaLocation: media
traccarUsername: frankose@ifi.uio.no

secretKey: secret
 
serviceAccountSecretName: calculator-scheduler-token-j9nmc # Not in use?
k8sApi: https://airsports2-dns-3bdbed7d.hcp.northeurope.azmk8s.io:443 #https://airsports-dns-b66fdeca.hcp.northeurope.azmk8s.io:443

mbtilesUrl: http://mbtiles-service/

ingress:
  enabled: true
  className: ""
  annotations:
    kubernetes.io/ingress.global-static-ip-name: public
    networking.gke.io/managed-certificates: airsports2
    kubernetes.io/ingress.class: "gce"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.0"
    nginx.ingress.kubernetes.io/connection-proxy-header: "keep-alive"
  hosts:
    - host: airsports.no
      paths:
        - path: /ws/
          pathType: Prefix
          serviceName: tracker-daphne-service
          servicePort: 80
        - path: /
          pathType: Prefix
          serviceName: tracker-web-service
          servicePort: 80
    - host: www.airsports.no
      paths:
        - path: /ws/
          pathType: Prefix
          serviceName: tracker-daphne-service
          servicePort: 80
        - path: /
          pathType: Prefix
          serviceName: tracker-web-service
          servicePort: 80
    - host: traccar.airsports.no
      paths:
        - path: /
          pathType: Prefix
          serviceName: traccar-service
          servicePort: 8082
    - host: home.airsports.no
      paths:
        - path: /
          pathType: Prefix
          serviceName: airsportsrelease-wordpress-v2
          servicePort: 80
    - host: traccarclient.airsports.no
      paths:
        - path: /
          pathType: Prefix
          serviceName: traccar-service
          servicePort: 5055
    - host: mbtiles.airsports.no
      paths:
        - path: /
          pathType: Prefix
          serviceName: mbtiles-service
          servicePort: 80

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  targetAverageCPUUtilizationPercentage: 600 # Allowed to use 6 times the initial resource request before scaling.
#  targetCPUUtilizationPercentage: 80
#   targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

traccar:
  database: traccar
  username: traccar

externalMysql:
  host: 10.95.241.3

externalRedis:
#  host: 10.95.241.11
  port: 6379

redis:
  enabled: true
  
  # Reduced to 1 replica to save cost in GKE Autopilot
  replicas: 2
  
  
  image:
    repository: redis
    tag: 7.2-alpine # Official versioned tag
  
  auth: false # Keeping consistent with your original "auth: enabled: false"
  
  # Persistence for scoring state
  persistentVolume:
    enabled: true
    size: 5Gi
    storageClass: standard-rwo

  # GKE Autopilot Resource Alignment & Redis Configuration
  # Note: Since the redis-ha subchart is aliased as 'redis', its values
  # are provided under the top-level 'redis:' key.
  # The subchart itself has a 'redis:' key for the main server config.
  redis:
    disableCommands: []
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 512Mi
    terminationGracePeriodSeconds: 25

  init:
    resources:
      requests:
        cpu: 500m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 128Mi

  splitBrainDetection:
    resources:
      requests:
        cpu: 500m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 128Mi

  sentinel:
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 256Mi

  haproxy:
    enabled: true
    resources:
      requests:
        cpu: 500m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 128Mi
    init:
      resources:
        requests:
          cpu: 500m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 128Mi

wordpress:
  enabled: true
  
  # Override name to avoid spec.selector immutability error on upgrade
  # This creates a new deployment instead of patching the existing one.
  fullnameOverride: "airsportsrelease-wordpress-v2"

  # HelmForge uses the official WordPress image by default
  image:
    tag: "6.7-apache"
  
  # WordPress Setup Configuration
  wordpress:
    siteUrl: "https://home.airsports.no"
    siteTitle: "Air Sports Live Tracking"
    adminUser: kolaf
    adminEmail: frankose@ifi.uio.no
    tablePrefix: "wp_"
    debug: true
    configExtra: |
      if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && $_SERVER['HTTP_X_FORWARDED_PROTO'] == 'https') {
          $_SERVER['HTTPS'] = 'on';
      }
      // Prevent 301 redirects for Google Cloud Health Checks
      if (strpos($_SERVER['HTTP_USER_AGENT'], 'GoogleHC') !== false || $_SERVER['REMOTE_ADDR'] == '127.0.0.1') {
          $_SERVER['HTTPS'] = 'off';
      }

  # External Database Configuration (HelmForge style)
  database:
    mode: external
    external:
      host: 10.95.241.3
      name: bitnami_wordpress
      username: bn_wordpress
      # password is provided via secret values file (e.g. private_values.yaml)
  
  # GKE Autopilot Affinity
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: cloud.google.com/gke-spot
                operator: In
                values:
                  - "true"

  # GKE Autopilot Resource Alignment
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi

  terminationGracePeriodSeconds: 25

  # Persistent Storage
  persistence:
    enabled: true
    size: 10Gi
    # mountPath is hardcoded to /var/www/html in this chart

  # MySQL subchart for WordPress is disabled as we use an external database
  mysql:
    enabled: false

  # PHP configuration (php.ini)
  php:
    ini: |
      upload_max_filesize = 512M
      post_max_size = 512M
      memory_limit = 512M
      max_execution_time = 300
      max_input_time = 300


mysql:
  enabled: false
  # from https://github.com/bitnami/charts/blob/master/bitnami/mysql/values.yaml
  primary:
    priorityClassName: high-priority
    pdb:
      create: true
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 500m
        memory: 2Gi
#      limits:
#        memory: 8Gi
    persistence:
      size: 20Gi  # Manually resized
    configuration: |-
      [mysqld]
      default_authentication_plugin=mysql_native_password
      skip-name-resolve
      max_allowed_packet=1000M
      max_connections=1024
      explicit_defaults_for_timestamp
      basedir=/opt/bitnami/mysql
      plugin_dir=/opt/bitnami/mysql/lib/plugin
      port=3306
      socket=/opt/bitnami/mysql/tmp/mysql.sock
      datadir=/bitnami/mysql/data
      tmpdir=/opt/bitnami/mysql/tmp
      bind-address=0.0.0.0
      pid-file=/opt/bitnami/mysql/tmp/mysqld.pid
      log-error=/opt/bitnami/mysql/logs/mysqld.log
      character-set-server=UTF8
      collation-server=utf8_general_ci
      [client]
      port=3306
      socket=/opt/bitnami/mysql/tmp/mysql.sock
      default-character-set=UTF8
      plugin_dir=/opt/bitnami/mysql/lib/plugin
      [manager]
      port=3306
      socket=/opt/bitnami/mysql/tmp/mysql.sock
      pid-file=/opt/bitnami/mysql/tmp/mysqld.pid
  secondary:
    persistence:
      size: 20Gi
    replicaCount: 1
    configuration: |-
      [mysqld]
      default_authentication_plugin=mysql_native_password
      skip-name-resolve
      explicit_defaults_for_timestamp
      basedir=/opt/bitnami/mysql
      port=3306
      socket=/opt/bitnami/mysql/tmp/mysql.sock
      datadir=/bitnami/mysql/data
      tmpdir=/opt/bitnami/mysql/tmp
      max_allowed_packet=1000M
      max_connections=1024
      bind-address=0.0.0.0
      pid-file=/opt/bitnami/mysql/tmp/mysqld.pid
      log-error=/opt/bitnami/mysql/logs/mysqld.log
      character-set-server=UTF8
      collation-server=utf8_general_ci
      [client]
      port=3306
      socket=/opt/bitnami/mysql/tmp/mysql.sock
      default-character-set=UTF8
      [manager]
      port=3306
      socket=/opt/bitnami/mysql/tmp/mysql.sock
      pid-file=/opt/bitnami/mysql/tmp/mysqld.pid
  auth:
    rootPassword: tracker
  initdbScripts:
    init_db.sql: |
      CREATE DATABASE IF NOT EXISTS traccar;
      CREATE DATABASE IF NOT EXISTS tracker;

      CREATE USER 'traccar'@'%' IDENTIFIED BY 'traccar';
      CREATE USER 'tracker'@'%' IDENTIFIED BY 'tracker';

      GRANT ALL PRIVILEGES ON traccar.* To 'traccar'@'%';
      GRANT ALL PRIVILEGES ON tracker.* To 'tracker'@'%';
      GRANT ALL PRIVILEGES ON bitnami_wordpress.* To 'bn_wordpress'@'%';
      FLUSH PRIVILEGES;
