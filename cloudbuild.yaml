steps:
- name: 'gcr.io/cloud-builders/git'
  entrypoint: 'bash'
  args:
  - -c
  - |
    git submodule update --init
- name: 'gcr.io/cloud-builders/docker'
  # Tolerates failure: this is just a build-cache warm-up, and there is
  # nothing to pull yet the first time a repository is used (e.g. right
  # after moving registries). --cache-from degrades gracefully to no
  # cache hit if the image was never pulled.
  allowFailure: true
  args: ['pull','europe-north1-docker.pkg.dev/${PROJECT_ID}/airsports/tracker_base:latest']
- name: 'gcr.io/cloud-builders/docker'
  args: ['build','--build-arg', 'BUILDKIT_INLINE_CACHE=1','-t','tracker_base','--cache-from','europe-north1-docker.pkg.dev/${PROJECT_ID}/airsports/tracker_base:latest','-t','europe-north1-docker.pkg.dev/${PROJECT_ID}/airsports/tracker_base:latest','-t','europe-north1-docker.pkg.dev/${PROJECT_ID}/airsports/tracker_base:${SHORT_SHA}','.']
  env: ['DOCKER_BUILDKIT=1']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push','europe-north1-docker.pkg.dev/${PROJECT_ID}/airsports/tracker_base:${SHORT_SHA}']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push','europe-north1-docker.pkg.dev/${PROJECT_ID}/airsports/tracker_base:latest']
- name: gcr.io/cloud-builders/gcloud
  entrypoint: bash
  args:
    - '-c'
    - |
      if [ "$BRANCH_NAME" = "main" ]
      then
      # Pinned to this build's exact commit, not --branch=main: triggering by branch name
      # re-resolves against whatever is currently HEAD of main when this step runs, which
      # can be a *different*, not-yet-built commit if pushes land close together - that
      # raced a deploy onto an image that was never pushed (2026-09-04 incident).
      gcloud builds triggers run Deploy --sha=$COMMIT_SHA --region=europe-west1 --project=${PROJECT_ID}
      fi
- name: 'gcr.io/cloud-builders/docker'
  id: 'Start Dependencies'
  args: ['compose','up','-d','mysql','redis']
  env:
  - 'DISABLE_FIREBASE=1'
- name: 'gcr.io/cloud-builders/docker'
  id: 'Run Tests'
  entrypoint: 'bash'
  env:
  - 'DISABLE_FIREBASE=1'
  args:
  - '-c'
  - |
    echo "Preparing environment..."
    mkdir -p src/reports
    chmod 777 src/reports
    docker compose run --rm -u root tracker_daphne chown -R django:django /src/reports
    
    echo "Waiting for DB..."
    docker compose run --rm tracker_daphne /bin/bash -c "/wait-for-it.sh \"mysql:3306\" -t 60"
    
    echo "Running migrations..."
    docker compose run --rm tracker_daphne python3 manage.py migrate
    
    echo "Running pytest..."
    docker compose run --rm tracker_daphne pytest -v -p no:cov --junitxml reports/django_test_results.xml
- name: 'gcr.io/cloud-builders/docker'
  args: ['compose','down']

images:
- 'europe-north1-docker.pkg.dev/${PROJECT_ID}/airsports/tracker_base:${SHORT_SHA}'
- 'europe-north1-docker.pkg.dev/${PROJECT_ID}/airsports/tracker_base:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: '7200s'
