name: CI

# Builds the image and runs the backend test suite for every pull request and
# for pushes to main. Nothing here pushes an image or touches GCP: the
# registry push and deploy remain Cloud Build's job (cloudbuild.yaml), run
# from main only.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # docker-compose.yml resolves the image as ${REGISTRY_NAME}tracker_base:${IMAGE_TAG}.
      # Point it at the locally built image so compose never pulls from the registry.
      REGISTRY_NAME: local/
      IMAGE_TAG: ci
      DISABLE_FIREBASE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # No Sentry secret is passed: the Dockerfile treats it as optional, and
      # PR builds must not upload releases/sourcemaps anyway.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: local/tracker_base:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start dependencies
        run: docker compose up -d mysql redis

      - name: Run tests
        run: |
          mkdir -p src/reports
          chmod 777 src/reports
          docker compose run --rm -u root tracker_daphne chown -R django:django /src/reports
          docker compose run --rm tracker_daphne /bin/bash -c '/wait-for-it.sh "mysql:3306" -t 60'
          docker compose run --rm tracker_daphne python3 manage.py migrate
          docker compose run --rm tracker_daphne pytest -v -p no:cov --junitxml reports/django_test_results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: django-test-results
          path: src/reports/django_test_results.xml
          if-no-files-found: ignore

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color mysql redis | tail -200

      - name: Stop dependencies
        if: always()
        run: docker compose down
